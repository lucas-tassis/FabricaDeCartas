server.port=${PORT:8081}

# File upload limits — increased to support large image batches
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true

# Tomcat 10.1.24+ changed maxParts default to 10 — raise for bulk image uploads
server.tomcat.max-parts=-1

# Always include full stack trace in error responses for debugging
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-exception=true
